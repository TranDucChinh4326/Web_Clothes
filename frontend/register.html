<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Đăng ký thành viên | Clothique</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400;1,600&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="assets/css/styles.css?v=2.2" />
  </head>
  <body style="background: linear-gradient(135deg, #f8fafc 0%, #f1f5f9 100%);">
    <main class="auth-shell">
      <div class="auth-card">
        <div class="auth-header">
          <a class="brand" href="index.html">Clothique</a>
          <h1>Tạo tài khoản</h1>
          <p>Trở thành thành viên Clothique Club để nhận ưu đãi 10% cho đơn đầu tiên</p>
        </div>

        <div class="social-auth">
          <button class="btn" type="button" style="font-size: 13px; font-weight: 600;">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
              <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
              <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
              <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z" fill="#FBBC05"/>
              <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z" fill="#EA4335"/>
            </svg>
            Google
          </button>

          <button class="btn" type="button" style="font-size: 13px; font-weight: 600;">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
              <path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M15.97 6.37c.62-.75 1.04-1.8 0.93-2.85-.9.04-1.99.6-2.63 1.35-.57.65-1.06 1.71-.93 2.74 1.01.08 2.02-.49 2.63-1.24z"/>
            </svg>
            Apple
          </button>
        </div>

        <div class="divider">Hoặc điền thông tin</div>

        <form class="form" id="register-form" action="login.html">
          <div class="form-group">
            <label for="reg-name">Họ và tên *</label>
            <input type="text" id="reg-name" placeholder="Nguyễn Văn A" required />
          </div>

          <div class="form-group">
            <label for="reg-email">Địa chỉ Email *</label>
            <input type="email" id="reg-email" placeholder="name@example.com" required />
          </div>

          <div class="form-group">
            <label for="reg-password">Mật khẩu (Tối thiểu 8 ký tự) *</label>
            <input type="password" id="reg-password" placeholder="••••••••" minlength="8" required />
          </div>

          <button class="btn primary full lg" type="submit" style="margin-top: 10px;">
            Đăng ký tài khoản
          </button>

          <p style="text-align: center; font-size: 14px; color: var(--muted); margin-top: 12px;">
            Đã có tài khoản? <a href="login.html" style="font-weight: 700; color: var(--ink); text-decoration: underline;">Đăng nhập ngay</a>
          </p>

          <div style="text-align: center; margin-top: 16px;">
            <a href="index.html" style="font-size: 13px; color: var(--muted);">← Quay lại trang chủ</a>
          </div>
        </form>
      </div>
    </main>

    <script src="assets/js/cart-store.js?v=2.2"></script>
    <script src="assets/js/water-ripple.js"></script>
  </body>
</html>
